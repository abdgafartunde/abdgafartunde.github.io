# Build and Deploy Site
# Builds the site with Jekyll and deploys it to GitHub Pages.
#
# HOW SCHEDULED POSTS ARE PUBLISHED:
#   Posts dated in the future stay hidden (`future: false` in _config.yml).
#   A daily build at 00:07 China Standard Time (the site's timezone) publishes
#   each post on the date in its front matter. No commits are needed.
#
# CV.pdf is compiled from CV.tex during every build, so the site always has
# the latest CV. Edit CV.tex; the PDF in your working copy is for local preview.
#
# Pull requests are built to catch errors but are not deployed.
# You can also trigger a build manually from the Actions tab.

name: Build and Deploy Site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 16:07 UTC = 00:07 China Standard Time
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true  # Ruby version comes from .ruby-version

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # CV.pdf is compiled from CV.tex on every build. A CV problem must never
      # block the site, so if TeX Live or the compile fails, the CV.pdf that
      # is currently live is kept instead.
      - name: Install TeX Live for the CV
        continue-on-error: true
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic latexmk enumitem fontawesome5 fontname times titlesec xcolor

      - name: Build CV.pdf from CV.tex
        run: |
          outdir="$RUNNER_TEMP/cv"
          mkdir -p "$outdir"
          if latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$outdir" CV.tex; then
            cp "$outdir/CV.pdf" CV.pdf
            echo "CV.pdf compiled from CV.tex"
          else
            echo "::warning title=CV not updated::CV.tex did not compile; keeping the CV.pdf that is currently live."
            curl -fsSL -o CV.pdf https://abdgafartunde.github.io/CV.pdf \
              || echo "::warning title=CV missing::Could not fetch the live CV.pdf either."
          fi

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in public repositories after 60 days
  # without repository activity. During long quiet periods, push one empty
  # commit so that scheduled posts keep publishing.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push an empty commit after 50 quiet days
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled publishing active"
            git push
          fi
